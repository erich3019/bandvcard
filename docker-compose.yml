name: bandvcard

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/minio images are no longer published; Chainguard only offers "latest" for free.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Development is required for DEV_LOGIN_EMAIL; set ASPNETCORE_ENVIRONMENT=Production in .env for real use.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Test switch: sign in as this user without Microsoft. Leave empty to use Entra.
      Auth__DevLoginEmail: ${DEV_LOGIN_EMAIL:-}
      # Comma-separated addresses that are made admin at every login.
      Auth__AdminEmails: ${ADMIN_EMAILS:-}
      # Without the test switch, login stays disabled (503) until all three Entra values are set.
      Entra__TenantId: ${ENTRA_TENANT_ID:-}
      Entra__ClientId: ${ENTRA_CLIENT_ID:-}
      Entra__ClientSecret: ${ENTRA_CLIENT_SECRET:-}
      DataProtection__KeysPath: /keys
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
    volumes:
      - backend-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      # The HTTP listener redirects to this port, so it must be the port the browser uses.
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-8443}
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  backend-keys:
  minio-data:
