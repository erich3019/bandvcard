server {
    listen 80;
    server_name _;

    # Docker's DNS. Resolving per request (via the variables below) keeps nginx working
    # when a container is recreated and gets a new address.
    resolver 127.0.0.11 valid=10s;
    set $frontend http://frontend:3000;
    set $backend http://backend:8080;

    # Business card photos
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Always overwritten here so clients cannot spoof the host the backend builds login redirects from.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The /api prefix is passed through unchanged to the backend.
    location /api/ {
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
    }
}
